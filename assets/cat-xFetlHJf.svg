<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <radialGradient id="bodyGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7F00;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="headGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFB84D;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6851A;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="pawGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D2F0A;stop-opacity:1" />
    </radialGradient>

    <!-- 그림자 필터 -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- 전체 그림자 -->
  <ellipse cx="100" cy="180" rx="50" ry="8" fill="#00000020"/>

  <!-- Cat body -->
  <ellipse cx="100" cy="120" rx="45" ry="35" fill="url(#bodyGradient)" stroke="#E6851A" stroke-width="1.5" filter="url(#dropshadow)"/>

  <!-- 몸통 털 질감 -->
  <ellipse cx="95" cy="115" rx="30" ry="25" fill="#FFAA33" opacity="0.3"/>
  <ellipse cx="105" cy="125" rx="25" ry="20" fill="#FF9500" opacity="0.2"/>

  <!-- Cat head -->
  <circle cx="100" cy="70" r="35" fill="url(#headGradient)" stroke="#E6851A" stroke-width="1.5" filter="url(#dropshadow)"/>

  <!-- 머리 털 질감 -->
  <ellipse cx="95" cy="65" rx="25" ry="20" fill="#FFAA33" opacity="0.3"/>
  <circle cx="105" cy="70" r="18" fill="#FF9500" opacity="0.2"/>

  <!-- Cat ears with depth -->
  <polygon points="75,45 85,25 95,45" fill="url(#headGradient)" stroke="#E6851A" stroke-width="1.5"/>
  <polygon points="105,45 115,25 125,45" fill="url(#headGradient)" stroke="#E6851A" stroke-width="1.5"/>

  <!-- Inner ears with shadow -->
  <polygon points="78,42 83,30 88,42" fill="#FFE4B5"/>
  <polygon points="112,42 117,30 122,42" fill="#FFE4B5"/>
  <polygon points="80,40 83,32 86,40" fill="#FFCCCB"/>
  <polygon points="114,40 117,32 120,40" fill="#FFCCCB"/>

  <!-- Cat eyes - more realistic -->
  <ellipse cx="90" cy="65" rx="8" ry="10" fill="url(#eyeGradient)" stroke="#1B5E20" stroke-width="0.5"/>
  <ellipse cx="110" cy="65" rx="8" ry="10" fill="url(#eyeGradient)" stroke="#1B5E20" stroke-width="0.5"/>

  <!-- 눈동자 -->
  <ellipse cx="90" cy="67" rx="2.5" ry="6" fill="#000"/>
  <ellipse cx="110" cy="67" rx="2.5" ry="6" fill="#000"/>

  <!-- 반사광 -->
  <ellipse cx="88" cy="63" rx="1" ry="2" fill="#FFF"/>
  <ellipse cx="108" cy="63" rx="1" ry="2" fill="#FFF"/>
  <circle cx="91" cy="65" r="0.5" fill="#FFF" opacity="0.7"/>
  <circle cx="111" cy="65" r="0.5" fill="#FFF" opacity="0.7"/>

  <!-- Cat nose with gradient -->
  <polygon points="100,75 95,80 105,80" fill="#FF69B4" stroke="#FF1493" stroke-width="0.5"/>
  <ellipse cx="100" cy="77" rx="3" ry="2" fill="#FF91A4"/>

  <!-- Cat mouth -->
  <path d="M 100 82 Q 95 85 90 82" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 100 82 Q 105 85 110 82" stroke="#8B4513" stroke-width="1.5" fill="none"/>

  <!-- Cat whiskers - thicker and more visible -->
  <line x1="65" y1="68" x2="40" y2="66" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="40" y2="75" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="82" x2="40" y2="84" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="68" x2="160" y2="66" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="75" x2="160" y2="75" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="82" x2="160" y2="84" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>

  <!-- Cat legs with joints -->
  <ellipse cx="80" cy="150" rx="10" ry="18" fill="url(#bodyGradient)" stroke="#E6851A" stroke-width="1"/>
  <ellipse cx="120" cy="150" rx="10" ry="18" fill="url(#bodyGradient)" stroke="#E6851A" stroke-width="1"/>
  <ellipse cx="85" cy="152" rx="10" ry="15" fill="url(#bodyGradient)" stroke="#E6851A" stroke-width="1"/>
  <ellipse cx="115" cy="152" rx="10" ry="15" fill="url(#bodyGradient)" stroke="#E6851A" stroke-width="1"/>

  <!-- Cat paws with toes -->
  <ellipse cx="80" cy="168" rx="8" ry="6" fill="url(#pawGradient)"/>
  <ellipse cx="120" cy="168" rx="8" ry="6" fill="url(#pawGradient)"/>
  <ellipse cx="85" cy="167" rx="8" ry="6" fill="url(#pawGradient)"/>
  <ellipse cx="115" cy="167" rx="8" ry="6" fill="url(#pawGradient)"/>

  <!-- 발가락 -->
  <circle cx="77" cy="166" r="2" fill="#5D2F0A"/>
  <circle cx="83" cy="166" r="2" fill="#5D2F0A"/>
  <circle cx="117" cy="166" r="2" fill="#5D2F0A"/>
  <circle cx="123" cy="166" r="2" fill="#5D2F0A"/>

  <!-- Cat tail with curve and gradient -->
  <path d="M 55 130 Q 35 120 25 100 Q 20 85 30 75 Q 40 70 50 80"
        fill="none" stroke="url(#bodyGradient)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 55 130 Q 35 120 25 100 Q 20 85 30 75 Q 40 70 50 80"
        fill="none" stroke="#FF9500" stroke-width="12" stroke-linecap="round"/>

  <!-- Cat stripes - more natural -->
  <path d="M 75 110 Q 100 108 125 110" stroke="#E6851A" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 70 125 Q 100 122 130 125" stroke="#E6851A" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 75 140 Q 100 137 125 140" stroke="#E6851A" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- 머리 줄무늬 -->
  <path d="M 80 55 Q 100 52 120 55" stroke="#E6851A" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 85 45 Q 100 42 115 45" stroke="#E6851A" stroke-width="2" fill="none" opacity="0.7"/>
</svg>